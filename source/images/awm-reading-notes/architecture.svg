<svg style="background:#ffffff" class="paper-svg" viewBox="0 0 760 475" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">通用 Agent 执行结构与 AWM 新增的流程记忆支路</title><desc id="arch-desc">任务指令、观察与记忆输入语言模型，模型输出动作并作用于环境，环境反馈观察。在线 AWM 将任务结束后的经历交给成功评价，通过后归纳 workflow 并更新记忆，供后续任务使用。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#6b80b4"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#bf3546"/></marker></defs> <g fill="#f0f3fa" stroke="#95A9D8" stroke-width="1.5"><rect x="16" y="46" width="170" height="68" rx="9"/><rect x="255" y="46" width="150" height="68" rx="9"/><rect x="468" y="46" width="108" height="68" rx="9"/><rect x="637" y="46" width="108" height="68" rx="9"/><rect x="255" y="186" width="150" height="63" rx="9"/></g> <g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#26332f"><text x="101" y="74">任务指令 q</text><text x="101" y="98">当前观察 o</text><text x="330" y="75">语言模型 LLM</text><text x="330" y="98" font-size="13" fill="#68778e">生成下一步动作</text><text x="522" y="86">动作 a</text><text x="691" y="86">环境</text><text x="330" y="213">记忆 M</text><text x="330" y="235" font-size="12" fill="#68778e">基础说明 ＋ 已有 workflow</text></g> <g fill="none" stroke="#6b80b4" stroke-width="1.7" marker-end="url(#blue)"><path d="M186 80H255"/><path d="M405 80H468"/><path d="M576 80H637"/><path d="M330 186V114"/><path d="M691 114V150H101V114"/></g><g font-family="sans-serif" font-size="12" fill="#68778e"><text x="411" y="143">环境反馈 → 下一步观察</text><text x="340" y="174">提供上下文</text></g> <rect x="15" y="285" width="730" height="160" rx="12" fill="#fff7f8" stroke="#bf3546" stroke-dasharray="5 4"/><text x="35" y="313" fill="#bf3546" font-family="sans-serif" font-size="15" font-weight="bold">＋ AWM：在线积累流程记忆</text> <g fill="#fff" stroke="#bf3546" stroke-width="1.5"><rect x="35" y="338" width="178" height="70" rx="8"/><rect x="282" y="338" width="178" height="70" rx="8"/><rect x="531" y="338" width="178" height="70" rx="8"/></g> <g font-family="sans-serif" text-anchor="middle" fill="#a72a3b"><text x="124" y="367" font-size="16">经历 e → 成功评价</text><text x="124" y="391" font-size="12">任务指令 ＋ 执行轨迹</text><text x="371" y="367" font-size="16">归纳模块 I</text><text x="371" y="391" font-size="12">提炼可复用 workflow</text><text x="620" y="367" font-size="16">更新流程记忆</text><text x="620" y="391" font-size="12">供后续任务使用</text></g> <g fill="none" stroke="#bf3546" stroke-width="1.7" marker-end="url(#red)"><path d="M213 373H282"/><path d="M460 373H531"/><path d="M620 338V218H405"/><path d="M50 114V338"/></g><g font-family="sans-serif" fill="#bf3546" font-size="12"><text x="225" y="362">判为成功</text><text x="60" y="269">任务结束后</text><text x="35" y="430">评价未通过：不从该经历新增流程</text></g></svg>