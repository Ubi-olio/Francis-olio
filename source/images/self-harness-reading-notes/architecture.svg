<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d" style="background:white"><title id="t">Self-Harness 的执行结构与自改进支路</title><desc id="d">固定模型在当前框架下执行任务，轨迹进入弱点挖掘，同模型提出修改，回归验证通过后更新框架并进入下一轮。</desc><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6b80b4"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#bf3546"/></marker></defs><rect x="20" y="30" width="160" height="65" rx="8" fill="#f0f3fa" stroke="#95A9D8"/><text x="100.0" y="58" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#26332f">任务与观察</text><rect x="265" y="30" width="200" height="65" rx="8" fill="#f0f3fa" stroke="#95A9D8"/><text x="365.0" y="58" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#26332f">固定模型 M</text><text x="365.0" y="80" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#596776">推理并生成操作</text><rect x="560" y="30" width="180" height="65" rx="8" fill="#f0f3fa" stroke="#95A9D8"/><text x="650.0" y="58" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#26332f">动作与环境</text><text x="650.0" y="80" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#596776">执行并返回反馈</text><rect x="265" y="170" width="200" height="65" rx="8" fill="#f0f3fa" stroke="#95A9D8"/><text x="365.0" y="198" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#26332f">当前 Harness hₜ</text><text x="365.0" y="220" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#596776">提示、工具、运行 hook</text><path d="M180 62H265" fill="none" stroke="#6b80b4" stroke-width="2" marker-end="url(#b)"/><path d="M465 62H560" fill="none" stroke="#6b80b4" stroke-width="2" marker-end="url(#b)"/><path d="M650 95V130H100V95" fill="none" stroke="#6b80b4" stroke-width="2" marker-end="url(#b)"/><path d="M365 170V95" fill="none" stroke="#6b80b4" stroke-width="2" marker-end="url(#b)"/><rect x="15" y="290" width="730" height="165" rx="10" fill="#fff7f8" stroke="#bf3546" stroke-dasharray="5 4"/><text x="35" y="318" fill="#bf3546" font-family="sans-serif" font-size="16">＋ Self-Harness：根据执行证据迭代修改运行框架</text><rect x="35" y="340" width="190" height="70" rx="8" fill="#fff7f8" stroke="#bf3546"/><text x="130.0" y="368" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#26332f">挖掘弱点</text><text x="130.0" y="390" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#596776">执行轨迹与验证证据</text><rect x="285" y="340" width="190" height="70" rx="8" fill="#fff7f8" stroke="#bf3546"/><text x="380.0" y="368" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#26332f">提出修改</text><text x="380.0" y="390" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#596776">同一模型在当前 hₜ 下</text><rect x="535" y="340" width="190" height="70" rx="8" fill="#fff7f8" stroke="#bf3546"/><text x="630.0" y="368" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#26332f">回归验证</text><text x="630.0" y="390" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#596776">筛选并合并有效修改</text><path d="M225 375H285" fill="none" stroke="#bf3546" stroke-width="2" marker-end="url(#r)"/><path d="M475 375H535" fill="none" stroke="#bf3546" stroke-width="2" marker-end="url(#r)"/><path d="M100 130V340" fill="none" stroke="#bf3546" stroke-width="2" marker-end="url(#r)"/><path d="M630 340V202H465" fill="none" stroke="#bf3546" stroke-width="2" marker-end="url(#r)"/><text x="485" y="192" fill="#bf3546" font-family="sans-serif" font-size="13">接受后更新为 hₜ₊₁</text><text x="35" y="439" fill="#a72a3b" font-family="sans-serif" font-size="13">未通过：记录候选，保留当前版本。模型权重与评价器固定。</text></svg>