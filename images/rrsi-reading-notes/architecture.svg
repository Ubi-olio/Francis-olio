<svg xmlns="http://www.w3.org/2000/svg" width="440" height="530" viewBox="0 0 440 530" role="img" aria-labelledby="title desc">
  <title id="title">RRSI 的 Agent 执行与 Harness 进化</title>
  <desc id="desc">固定模型在当前 Harness 中执行任务。外层用失败轨迹和历史提出改动，审查后评测，再依据分数底线和成本筛选，更新 Harness 并写回历史。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#546caa"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#bf3546"/>
    </marker>
  </defs>

  <rect width="440" height="530" rx="12" fill="#fff"/>
  <g fill="#f0f3fa" stroke="#95A9D8">
    <rect x="22" y="20" width="352" height="88" rx="8"/>
    <rect x="22" y="277" width="352" height="54" rx="8"/>
    <rect x="22" y="447" width="352" height="61" rx="8"/>
  </g>
  <g fill="#fff7f8" stroke="#bf3546">
    <rect x="22" y="169" width="352" height="84" rx="8"/>
    <rect x="22" y="355" width="352" height="68" rx="8"/>
  </g>
  <g fill="none" stroke-width="2" marker-end="url(#blue-arrow)" stroke="#546caa">
    <path d="M198 108V164"/>
    <path d="M198 253V272"/>
    <path d="M374 478H409V88H378"/>
  </g>
  <g fill="none" stroke-width="2" marker-end="url(#red-arrow)" stroke="#bf3546">
    <path d="M198 331V350"/>
    <path d="M198 423V442"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#26332f">
    <text x="198" y="48" font-size="22" font-weight="700">内层 · Agent 执行任务</text>
    <text x="198" y="75" font-size="20">任务和观察 → 固定 LLM → 动作</text>
    <text x="198" y="97" font-size="16">环境反馈进入下一步观察</text>
    <text x="111" y="143" font-size="17" fill="#354d8f">外层 · Harness 进化</text>
    <text x="270" y="143" font-size="17" fill="#354d8f">失败轨迹</text>
    <text x="198" y="198" font-size="22" font-weight="700" fill="#a12a38">新增 · 提案规则</text>
    <text x="198" y="223" font-size="18">改动预算 · 编辑历史 · 停滞探索</text>
    <text x="198" y="244" font-size="17">生成候选后先审源码差异</text>
    <text x="198" y="311" font-size="21">在进化集评测分数和 token</text>
    <text x="198" y="383" font-size="22" font-weight="700" fill="#a12a38">新增 · 入选门槛</text>
    <text x="198" y="408" font-size="18">历史分数底线 · 涨分与成本</text>
    <text x="198" y="472" font-size="21">选出下一版 Harness</text>
    <text x="198" y="495" font-size="16">记录结果，供下轮提案与剪枝参考</text>
    <text transform="translate(428 293) rotate(-90)" font-size="16" fill="#354d8f">带着下一版进入下一轮</text>
  </g>
</svg>
